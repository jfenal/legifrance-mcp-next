apiVersion: v1
kind: Secret
metadata:
  name: legifrance-mcp-secrets
  labels:
    app: legifrance-mcp
    component: mcp-server
type: Opaque
stringData:
  POSTGRES_DB: "postgres"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "CHANGE_ME"
  SESSION_SECRET: "CHANGE_ME_GENERATE_SECURE_RANDOM_KEY"
  # SSO_CLIENT_ID: ""
  # SSO_CLIENT_SECRET: ""
  # PISTE credentials (see https://piste.gouv.fr/registration) -- from the
  # "Identifiants Oauth" panel, NOT the "API Keys" panel (that's
  # JUDILIBRE_API_KEY below). Same variable names as .env.example/settings.py.
  LEGIFRANCE_CLIENT_ID: "CHANGE_ME"
  LEGIFRANCE_CLIENT_SECRET: "CHANGE_ME"
  # From PISTE's "API Keys" panel, required by rechercher_jurisprudence_judilibre
  JUDILIBRE_API_KEY: "CHANGE_ME"
