apiVersion: v1
kind: ConfigMap
metadata:
  name: legifrance-mcp-config
  labels:
    app: legifrance-mcp
    component: mcp-server
data:
  MCP_PORT: "5001"
  PYTHON_LOG_LEVEL: "INFO"
  MCP_TRANSPORT_PROTOCOL: "http"
  # "sandbox" or "production" -- not sensitive, the credentials that go
  # with it (LEGIFRANCE_OAUTH_ID/SECRET, JUDILIBRE_API_KEY) are in
  # secret.yaml, same variable names as .env.example/settings.py.
  PISTE_ENV: "production"
  CORS_ENABLED: "true"
  ENVIRONMENT: "production"
  ENABLE_AUTH: "false"
  SSO_CALLBACK_URL: ""
  SSO_AUTHORIZATION_URL: ""
  SSO_TOKEN_URL: ""
  SSO_INTROSPECTION_URL: ""
  MCP_HOST_ENDPOINT: ""
